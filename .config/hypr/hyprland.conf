# ------ Import Colors ------ #
source=~/.config/hypr/themes/carbonfox.conf

# ------ Environment Variables ------ #
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_QPA_PLATFORM, wayland 
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, macos-tahoe-cursor
env = HYPRCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, macos-tahoe-cursor

# Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto # For electron apps

# ------ Monitor & Scaling ------ #
monitor = DP-1, 1920x1080@144, 0x0, 1

# ------ Startup Executes ------ #
exec-once = waypaper --restore
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = systemctl --user start opentabletdriver
exec-once = systemctl --user start xdg-desktop-portal-wlr
exec-once = waybar
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ------ Input ------ #
input {
    # Keyboard
    kb_layout = us, ara
    kb_options = grp:alt_space_toggle

    # Mouse
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    # Touchpad
    touchpad {
        natural_scroll = true
        scroll_factor = 1
    }
}

# ------ General ------ #
general {
    # Borders and Gaps
    border_size = 0
    gaps_in = 5
    gaps_out = 10

    # Colors
    col.active_border = $overlay1
    col.inactive_border = $overlay2
}

# ------ Decoration ------ #
decoration {
    # Window Rounding
    rounding = 10

    # Opacity
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1

    # Shadows
    shadow {
        ignore_window = 3
        ignore_window = true
    }

    # Dimming
    dim_inactive = false
    dim_strength = 0.5

    # Blur
    blur {
        enabled = false
        size = 5
    }
}

# ------ Animations ------ #
animations {
    enabled = true

    # Make Workspaces Horizontal
    bezier = ease, 0, 0.9, 0.18, 1

    animation = workspaces, 1, 2, ease
    animation = windows, 1, 2, ease, slide
    animation = layers, 1, 2, default, default
}

# ------ Misc ------ #
misc {
    disable_hyprland_logo = true
    animate_manual_resizes = true
    force_default_wallpaper = 0

    mouse_move_enables_dpms = 0
}

# ------ XWayland ------ #
xwayland {
    force_zero_scaling = true
}


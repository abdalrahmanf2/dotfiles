[mgr]
# NOTE: can combined with tmTheme (sublime colorshceme file) for preview code highlight
# syntect_theme = "path/to/tmTheme"

cwd = { fg = "#B6B8BB", italic = true } # base06 (lighter gray for subtext)

# Hovered
hovered         = { bg = "#252525" } # base01 (darker background)
preview_hovered = { bg = "#252525" } # base01

# Find
find_keyword  = { fg = "#161616", bg = "#08BDBA", bold = true } # base00, base0A (teal/orange)
find_position = { fg = "#33B1FF", bg = "#252525", bold = true } # base0C (cyan), base01

# Marker
marker_copied   = { fg = "#25BE6A", bg = "#25BE6A" } # base0B (green)
marker_cut      = { fg = "#EE5396", bg = "#EE5396" } # base08 (red)
marker_marked   = { fg = "#BE95FF", bg = "#BE95FF" } # base0E (violet)
marker_selected = { fg = "#78A9FF", bg = "#78A9FF" } # base0D (blue)

# Tab
tab_active   = { fg = "#F2F4F8", bg = "#252525" } # base05, base01
tab_inactive = { fg = "#353535", bg = "#161616" } # base02, base00
tab_width    = 1

# Count
count_copied   = { fg = "#F2F4F8", bg = "#08BDBA" } # base05, base0A (teal)
count_cut      = { fg = "#F2F4F8", bg = "#EE5396" } # base05, base08 (red)
count_selected = { fg = "#F2F4F8", bg = "#78A9FF" } # base05, base0D (blue)

# Border
border_symbol = "│"
border_style  = { fg = "#33B1FF" } # base0C (cyan/light blue)

[mode]
normal_main = { fg = "#161616", bg = "#78A9FF", bold = true } # base00, base0D (blue)
normal_alt  = { fg = "#78A9FF", bg = "#353535" } # base0D (blue), base02

select_main = { fg = "#161616", bg = "#BE95FF", bold = true } # base00, base0E (violet)
select_alt  = { fg = "#BE95FF", bg = "#353535" } # base0E (violet), base02

unset_main  = { fg = "#161616", bg = "#BE95FF", bold = true } # base00, base0E (violet)
unset_alt   = { fg = "#BE95FF", bg = "#353535" } # base0E (violet), base02

[status]
separator_open    = ""
separator_close   = ""
# separator_style = { fg = "#353535", bg = "#353535" } # base02

# Progress
progress_label  = { fg = "#B6B8BB", bold = true } # base06
progress_normal = { fg = "#161616" } # base00
progress_error  = { fg = "#EE5396" } # base08 (red)

# Permissions
perm_type  = { fg = "#78A9FF" } # base0D (blue)
perm_read  = { fg = "#08BDBA" } # base0A (teal/orange)
perm_write = { fg = "#EE5396" } # base08 (red)
perm_exec  = { fg = "#25BE6A" } # base0B (green)
perm_sep   = { fg = "#353535" } # base02

[pick]
border   = { fg = "#33B1FF" } # base0C (cyan/light blue)
active   = { fg = "#F2F4F8",  bg = "#353535" } # base05, base02
inactive = { fg = "#F2F4F8" } # base05

# Input
[input]
border   = { fg = "#33B1FF" } # base0C (cyan/light blue)
title    = { fg = "#33B1FF" } # base0C (cyan/light blue)
value    = { fg = "#BE95FF" } # base0E (violet)
selected = { bg = "#353535" } # base02

# Completion
[completion]
border   = { fg = "#33B1FF" } # base0C (cyan/light blue)
active   = { fg = "#F2F4F8", bg = "#353535" } # base05, base02
inactive = { fg = "#F2F4F8" } # base05

icon_file    = ""
icon_folder  = ""
icon_command = ""

# Tasks
[tasks]
border  = { fg = "#33B1FF" } # base0C (cyan/light blue)
title   = { fg = "#33B1FF" } # base0C (cyan/light blue)
hovered = { fg = "#F2F4F8", bg="#252525" } # base05, base01

# Which
[which]
cols            = 3
mask            = { bg = "#161616" } # base00
cand            = { fg = "#33B1FF" } # base0C (cyan/light blue)
rest            = { fg = "#78A9FF" } # base0D (blue)
desc            = { fg = "#BE95FF" } # base0E (violet)
separator       = " ➜ "
separator_style = { fg = "#484848" } # base03

# Confirm
[confirm]
border  = { fg = "#33B1FF" } # base0C (cyan/light blue)
title   = { fg = "#33B1FF" } # base0C (cyan/light blue)
content = {}
list    = {}
btn_yes = { bg = "#353535" } # base02
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# Spot
[spot]
border  = { fg = "#33B1FF" } # base0C (cyan/light blue)
title   = { fg = "#33B1FF" } # base0C (cyan/light blue)

# Notify
[notify]
title_info  = { fg = "#33B1FF" } # base0C (cyan/light blue)
title_warn  = { fg = "#08BDBA" } # base0A (teal/orange)
title_error = { fg = "#EE5396" } # base08 (red)

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
on      = { fg = "#25BE6A" } # base0B (green)
run     = { fg = "#BE95FF" } # base0E (violet)
hovered = { bg = "#252525" } # base01
footer  = { fg = "#F2F4F8", bg = "#161616" } # base05, base00

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#08BDBA" }, # base0A (teal/orange)

	# Media
	{ mime = "{audio,video}/*", fg = "#BE95FF" }, # base0E (violet)

	# Archives
	{ mime = "application/*zip", fg = "#EE5396" }, # base08 (red)
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#EE5396" }, # base08 (red)

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#33B1FF" }, # base0C (cyan/light blue)

	# Empty files
	# { mime = "inode/x-empty", fg = "#EE5396" }, # base08 (red)

	# Special files
	{ name = "*", is = "orphan", bg = "#EE5396" }, # base08 (red)
	{ name = "*", is = "exec"  , fg = "#25BE6A" }, # base0B (green)

	# Fallback
	{ name = "*/", fg = "#78A9FF" } # base0D (blue)
]
